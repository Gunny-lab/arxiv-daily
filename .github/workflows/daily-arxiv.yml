name: Daily arXiv Screening

on:
  schedule:
    # 09:00 Asia/Seoul is 00:00 UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-daily-arxiv:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily arXiv screening
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ vars.NOTION_PARENT_PAGE_ID || '39751c6c82cb817bb84ce5cd2b9fdef7' }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID || 'b8a5a2eb179a49e3800ba185263d57e4' }}
        run: python arxiv_daily.py

      - name: Commit reports
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update daily arXiv report"
          file_pattern: "reports/*.md"

